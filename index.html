<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ADMIN | Admin</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080d17;color:#eef3fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #2b3a53;background:#172238;color:#edf3ff;border-radius:9px;padding:10px 14px}button:hover{background:#263750}.primary{background:#b8f65b;color:#101a07;border:0;font-weight:700}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #2b3a53;background:#0c1525;color:inherit}label{display:grid;gap:7px;margin:16px 0;font-size:14px}h1{font-size:30px;margin:8px 0}h2{font-size:19px}p,small,.muted{color:#8fa2bd}small{line-height:1.5}.login{max-width:430px;margin:12vh auto;background:#101a2b;border:1px solid #26344b;border-radius:20px;padding:32px}.brand{font-weight:800;letter-spacing:2px;color:#b8f65b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#0d1524;padding:28px 20px;border-right:1px solid #1e2a3d}nav{display:grid;gap:8px;margin:35px 0}nav button{text-align:left;background:transparent;border:0}nav button.selected{background:#243b25;color:#b8f65b}main{padding:34px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.pill{display:inline-block;border:1px solid #3d5027;background:#1b2d19;color:#b8f65b;border-radius:20px;padding:6px 12px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#101a2b;border:1px solid #23324a;border-radius:14px;padding:22px}.card strong{display:block;font-size:26px;margin:12px 0}.panel{margin-top:20px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}.toolbar input{max-width:340px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}td,th{text-align:left;padding:14px 12px;border-bottom:1px solid #23324a}th{color:#8fa2bd;font-weight:500}td button{padding:6px 9px;margin-right:5px}.empty{text-align:center;padding:45px;color:#8fa2bd}.bar{height:14px;background:#25334b;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#b8f65b}.error{color:#ff9696;min-height:20px}dialog{background:#101a2b;color:inherit;border:1px solid #3c4d68;border-radius:16px;width:min(480px,94vw);padding:26px}dialog::backdrop{background:#000a}.actions{display:flex;gap:10px;justify-content:flex-end}.hidden{display:none!important}#notice{color:#b8f65b}footer{margin-top:28px;font-size:12px;color:#8fa2bd}a{color:#b8f65b}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{display:block}aside{padding:18px;border-right:0}nav{display:flex;overflow:auto;margin:16px 0 0}nav button{white-space:nowrap}main{padding:20px}header{align-items:flex-start}.cards{grid-template-columns:1fr 1fr}.card{padding:16px}.card strong{font-size:21px}.toolbar{flex-wrap:wrap}.login{margin:8vh 18px}aside small{display:none}}
</style>
<section id="login" class="login"><div class="brand">NOVA ADMIN</div><h1>Controle da operação.</h1><p>Gestão interna dos administradores.</p><form id="loginForm"><label>Usuário ou e-mail<input name="username" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" style="width:100%">Entrar no painel</button><p class="error" id="loginError" role="alert"></p></form><small>Acesso restrito aos administradores autorizados.</small></section>
<div id="app" class="layout hidden"><aside><div class="brand">NOVA ADMIN</div><small>OPERATION CONSOLE</small><nav id="nav"></nav><small id="who"></small></aside><main><header><div><span class="pill" id="gatewayPill">GESTÃO INTERNA</span><h1 id="title">Visão geral</h1><span class="muted">Sua operação em um só lugar.</span></div><button id="logout">Sair</button></header><p id="notice" role="status"></p><div id="content"></div><footer>NOVA ADMIN · Backend Netlify · Dados persistidos no Supabase.</footer></main></div>
<dialog id="modal"><form id="editor"><h2 id="modalTitle"></h2><div id="fields"></div><p class="error" id="formError" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar</button></div></form></dialog>
<script>
let state,csrf='',page='overview',editing=null,resource='',query='',requestKey='';
const names={overview:'Visão geral',transactions:'Depósitos e saques',sites:'Sites criados',domains:'Domínios vinculados',users:'Administradores',audit:'Histórico de ações'};
const titles={sites:'site',domains:'domínio',users:'administrador',transactions:'movimentação'};
const $=id=>document.getElementById(id);
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(cents/100);
async function api(path,method='GET',data){const response=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data)});const value=await response.json();if(!response.ok){if(response.status===401){$('app').classList.add('hidden');$('login').classList.remove('hidden')}throw Error(value.error)}return value}
async function load(){state=await api('state');$('notice').textContent=state.truncated?'A lista atingiu o limite de registros. Os totais desta tela podem estar incompletos.':'';csrf=state.csrf;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Conectado como '+state.username;$('gatewayPill').textContent=state.gateway?.configured?'MERCADO PAGO · '+(state.gateway.mode==='production'?'PRODUÇÃO':'TESTES'):'MERCADO PAGO · CONFIGURAÇÃO PENDENTE';render()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const result=await api('login','POST',Object.fromEntries(new FormData(e.target)));csrf=result.csrf;e.target.reset();await load()}catch(error){$('loginError').textContent=error.message}};
$('logout').onclick=async()=>{try{await api('logout','POST',{});location.reload()}catch(e){$('notice').textContent=e.message}};
function siteName(id){return state.sites.find(s=>s.id===id)?.name||'Sem vínculo'}
function rowsHTML(rows){if(!rows.length)return '<tr><td colspan="8" class="empty">Nenhum registro encontrado. Adicione o primeiro.</td></tr>';return rows.map(r=>{let cells;if(page==='sites')cells=[r.name,r.url,r.status];if(page==='domains')cells=[r.name,siteName(r.site_id),r.status];if(page==='users')cells=[r.username,r.role==='supreme'?'Supremo':'Administrador',r.active?'ativo':'inativo'];if(page==='transactions')cells=[r.kind,r.customer,money(r.amount),r.status,siteName(r.site_id),r.created_at];if(page==='audit')cells=[r.actor,r.action,r.created_at];return '<tr>'+cells.map(c=>'<td>'+escape(c)+'</td>').join('')+(page==='audit'||page==='users'&&r.role==='supreme'?'':page==='transactions'&&(r.provider==='mercado_pago'||r.status==='concluido'||r.customer!==state.username)?'<td>Registro protegido</td>':'<td><button data-edit="'+r.id+'">Editar</button><button data-delete="'+r.id+'">Excluir</button></td>')+'</tr>'}).join('')}
function render(){
$('title').textContent=names[page];$('nav').innerHTML=Object.entries(names).filter(([key])=>key!=='users'||state.role==='supreme').map(([key,name])=>'<button data-page="'+key+'" class="'+(page===key?'selected':'')+'">'+name+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});
if(page==='overview'){const complete=state.transactions.filter(t=>t.status==='concluido');const deposits=complete.filter(t=>t.kind==='deposito').reduce((s,t)=>s+t.amount,0);const withdrawals=complete.filter(t=>t.kind==='saque').reduce((s,t)=>s+t.amount,0);const pending=state.transactions.filter(t=>t.status==='pendente').length;const cards=[['Depósitos concluídos',money(deposits)],['Saques concluídos',money(withdrawals)],['Saldo operacional',money(deposits-withdrawals)],['Pendências',pending]];$('content').innerHTML='<div class="cards">'+cards.map(([label,value])=>'<div class="card"><small>'+label+'</small><strong>'+value+'</strong><small>Supabase</small></div>').join('')+'</div><div class="panel"><div class="toolbar"><h2>Infraestrutura cadastrada</h2><button id="quick">Criar Pix</button></div><p>'+state.sites.length+' sites · '+state.domains.length+' domínios · '+state.users.filter(u=>u.active).length+' administradores ativos</p><h2>Depósitos versus saques</h2><div class="bar"><span style="width:'+(deposits+withdrawals?100*deposits/(deposits+withdrawals):0)+'%"></span></div><p>Depósitos: '+money(deposits)+' · Saques: '+money(withdrawals)+'</p><small>Depósitos Pix novos são enviados ao Mercado Pago. Status de pagamentos Mercado Pago são atualizados por webhook. Saques exigem um fluxo de payout real habilitado.</small></div><div class="panel"><h2>Últimas movimentações</h2>'+ (state.transactions.slice(0,5).map(t=>'<p>'+escape(t.customer)+' · '+escape(t.kind)+' · '+money(t.amount)+' · '+escape(t.status)+'</p>').join('')||'<p>Nenhuma movimentação registrada.</p>')+'</div>';$('quick').onclick=()=>openEditor('transactions',null,'deposito');return}
const headers={sites:['Nome','URL','Status'],domains:['Domínio','Site','Status'],users:['Login','Nível','Status'],transactions:['Tipo','Administrador','Valor','Status','Site','Data'],audit:['Administrador','Ação','Data']};$('content').innerHTML='<section class="panel"><div class="toolbar"><input id="search" aria-label="Buscar registros" placeholder="Buscar registros" value="'+escape(query)+'">'+(page==='audit'?'':'<button id="add" class="primary">'+(page==='transactions'?'Nova movimentação': 'Adicionar '+titles[page])+'</button>')+'</div><div class="scroll"><table><thead><tr>'+headers[page].map(h=>'<th>'+h+'</th>').join('')+(page==='audit'?'':'<th>Ações</th>')+'</tr></thead><tbody id="rows"></tbody></table></div></section>';
function draw(){const rows=state[page].filter(r=>Object.entries(r).filter(([k])=>k!=='password').some(([,v])=>String(v).toLowerCase().includes(query.toLowerCase())));$('rows').innerHTML=rowsHTML(rows);$('rows').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(page,state[page].find(r=>r.id===Number(b.dataset.edit))));$('rows').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir este registro? A ação ficará no histórico.'))return;try{await api(page+'/'+b.dataset.delete,'DELETE',{});await load();$('notice').textContent='Registro excluído.'}catch(e){$('notice').textContent=e.message}})}
$('search').oninput=e=>{query=e.target.value;draw()};if($('add'))$('add').onclick=()=>openEditor(page);draw();
}
function openEditor(type,row=null,kind='deposito'){
resource=type;editing=row;requestKey=crypto.randomUUID();$('modalTitle').textContent=(row?'Editar ':'Adicionar ')+titles[type];$('formError').textContent='';
const input=(key,label,value='',attr='')=>'<label>'+label+'<input name="'+key+'" value="'+escape(value)+'" '+attr+'></label>';
const select=(key,label,values,value)=>'<label>'+label+'<select name="'+key+'">'+values.map(([v,n])=>'<option value="'+escape(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+escape(n)+'</option>').join('')+'</select></label>';
const site=()=>select('site_id','Site vinculado',[['','Sem vínculo'],...state.sites.map(s=>[s.id,s.name])],row?.site_id||'');let html='';
if(type==='sites')html=input('name','Nome',row?.name,'required maxlength="240"')+input('url','URL',row?.url,'required type="url"')+select('status','Status',[['ativo','Ativo'],['inativo','Inativo']],row?.status||'ativo');
if(type==='domains')html=input('name','Domínio',row?.name,'required placeholder="exemplo.com"')+site()+select('status','Status',[['ativo','Ativo'],['inativo','Inativo']],row?.status||'ativo');
if(type==='users')html=input('username','Login',row?.username,'required autocomplete="off"')+input('password',row?'Nova senha (em branco mantém a atual)':'Senha','','type="password" minlength="12" maxlength="256" autocomplete="new-password" '+(row?'':'required'))+select('active','Status',[['1','Ativo'],['0','Inativo']],row ? (row.active ? '1' : '0') : '1');
if(type==='transactions')html=select('kind','Tipo',[['deposito','Depósito Pix'],['saque','Saque']],row?.kind||kind)+input('customer','Administrador',row?.customer||state.username,'readonly')+input('amount','Valor em reais',row?row.amount/100:'','required type="number" min="0.01" max="100000000" step="0.01"')+input('payer_email','E-mail do pagador',row?.payer_email||'','type="email"')+input('payer_document','CPF do pagador',row?.payer_document||'','inputmode="numeric"')+site()+select('status','Status',[['pendente','Pendente'],['concluido','Concluído'],['cancelado','Cancelado']],row?.status||'pendente');
$('fields').innerHTML=html;$('modal').showModal();
}
$('cancel').onclick=()=>$('modal').close();$('editor').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.idempotency_key=requestKey;const submit=e.target.querySelector('button.primary');submit.disabled=true;if(resource==='users')data.active=data.active==='1';try{let result;if(resource==='transactions'&&!editing&&data.kind==='deposito'){result=await api('mercadopago/pix','POST',data)}else{result=await api(resource+(editing?'/'+editing.id:''),editing?'PUT':'POST',data)}$('modal').close();await load();$('notice').textContent=result?.payment_id?'Pix criado no Mercado Pago. Pagamento #'+result.payment_id:'Registro salvo.';if(result?.qr_code)window.prompt('Pix copia e cola',result.qr_code)}catch(error){$('formError').textContent=error.message}finally{submit.disabled=false}};
load().catch(()=>{});
</script>
</html>
